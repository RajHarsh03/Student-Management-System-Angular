<div class="dashboard-container">
  <aside class="sidebar admin-sidebar">
    <div class="logo-area"><h2>Admin</h2></div>
    <nav class="nav-links">
      <a routerLink="/admin-dashboard"><span class="material-symbols-outlined" aria-hidden="true">dashboard</span>Dashboard</a>
      <a routerLink="/admin/students"><span class="material-symbols-outlined" aria-hidden="true">group</span>Manage Students</a>
      <a routerLink="/admin/attendance"><span class="material-symbols-outlined" aria-hidden="true">fact_check</span>Manage Attendance</a>
      <a routerLink="/admin/assessments"><span class="material-symbols-outlined" aria-hidden="true">assignment</span>Manage Assessments</a>
      <a routerLink="/admin/notices"><span class="material-symbols-outlined" aria-hidden="true">campaign</span>Manage Notices</a>
      <a routerLink="/admin/account" class="active-link"><span class="material-symbols-outlined" aria-hidden="true">manage_accounts</span>Account</a>
    </nav>
    <div class="sidebar-profile">
      <div class="sidebar-avatar">AU</div>
      <div class="sidebar-user-info"><strong>Admin User</strong><span>Administrator</span></div>
      <button class="btn-logout" type="button" aria-label="Logout" (click)="logout()"></button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-body">
      <div class="page-title-row">
        <h1>Account Details</h1>
      </div>

      <div class="account-card card">
        <div class="account-row">
          <span class="account-label">Role</span>
          <span class="account-value role-badge">Admin</span>
        </div>
        <div class="account-row">
          <span class="account-label">Username</span>
          <span class="account-value">{{ username }}</span>
        </div>
        <div class="account-row">
          <span class="account-label">Name</span>
          <span class="account-value">{{ name }}</span>
        </div>
        <div class="account-row">
          <span class="account-label">Session</span>
          <span class="account-value">Active</span>
        </div>
      </div>
    </div>
  </main>
</div>
